<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="960" viewBox="0 0 1920 960"><defs><radialGradient id="halo"><stop stop-color="#1C3830"/><stop offset="1" stop-color="#101419"/></radialGradient></defs><rect width="1920" height="960" fill="#101419"/><ellipse cx="1510" cy="400" rx="850" ry="720" fill="url(#halo)"/><g font-family="Arial, Helvetica, sans-serif"><image href="data:image/svg+xml;base64," x="88" y="68" width="64" height="64"/><text x="176" y="109" fill="#F1F4F8" font-size="30" font-weight="700">Claude &amp; Codex Weekly Usage</text><text x="1770" y="109" fill="#65716E" font-size="24" font-weight="700">04</text><path d="M88 161H1832" stroke="#2D353B"/><text x="88" y="278" fill="#F3F6FA" font-size="76" font-weight="800">Already signed in?</text><text x="88" y="371" fill="#F3F6FA" font-size="76" font-weight="800">You are ready.</text><text x="92" y="462" fill="#A6ADB9" font-size="31" font-weight="500">Uses your existing local logins.</text><text x="92" y="510" fill="#A6ADB9" font-size="31" font-weight="500">No manual session-key entry.</text><text x="92" y="648" fill="#67E9A1" font-size="26" font-weight="700">Independent checks every 60 seconds.*</text><rect x="1040" y="238" width="710" height="474" rx="34" fill="#171E25" stroke="#35443E" stroke-width="2"/><text x="1094" y="314" fill="#67E9A1" font-size="23" font-weight="700">ON YOUR MAC</text><text x="1094" y="383" fill="#F3F6FA" font-size="34" font-weight="700">Claude Desktop login</text><text x="1094" y="447" fill="#F3F6FA" font-size="34" font-weight="700">Codex ChatGPT login</text><path d="M1094 487H1690" stroke="#3B4843"/><text x="1094" y="546" fill="#A6ADB9" font-size="28" font-weight="500">macOS 13+ · Stream Deck 6.9+</text><text x="1094" y="600" fill="#A6ADB9" font-size="28" font-weight="500">English interface · Six key actions</text><text x="1094" y="654" fill="#67E9A1" font-size="25" font-weight="600">Local credential access · No telemetry</text><path d="M88 846H1832" stroke="#2D353B"/><text x="88" y="900" fill="#ADB8BA" font-size="24" font-weight="500">*While visible. Service retry delays may extend the interval.</text><text x="1458" y="900" fill="#697981" font-size="20" font-weight="400">Illustrative sample data</text></g></svg>