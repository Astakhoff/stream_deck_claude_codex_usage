<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="960" viewBox="0 0 1920 960"><defs><radialGradient id="halo"><stop stop-color="#1C3830"/><stop offset="1" stop-color="#101419"/></radialGradient></defs><rect width="1920" height="960" fill="#101419"/><ellipse cx="1510" cy="400" rx="850" ry="720" fill="url(#halo)"/><g font-family="Arial, Helvetica, sans-serif"><image href="data:image/svg+xml;base64," x="88" y="68" width="64" height="64"/><text x="176" y="109" fill="#F1F4F8" font-size="30" font-weight="700">Claude &amp; Codex Weekly Usage</text><text x="1770" y="109" fill="#65716E" font-size="24" font-weight="700">02</text><path d="M88 161H1832" stroke="#2D353B"/><text x="88" y="278" fill="#F3F6FA" font-size="78" font-weight="800">Your preferred</text><text x="88" y="371" fill="#F3F6FA" font-size="78" font-weight="800">perspective.</text><text x="92" y="462" fill="#A6ADB9" font-size="31" font-weight="500">Press the key to switch instantly.</text><text x="92" y="510" fill="#A6ADB9" font-size="31" font-weight="500">The number and bar change together.</text><text x="92" y="648" fill="#67E9A1" font-size="26" font-weight="700">Warnings always follow capacity left.</text><rect x="1000" y="282" width="316" height="316" rx="66" fill="#12171F" stroke="#464E5B" stroke-width="6"/><image href="data:image/svg+xml;base64," x="1008" y="290" width="300" height="300"/><rect x="1452" y="282" width="316" height="316" rx="66" fill="#12171F" stroke="#464E5B" stroke-width="6"/><image href="data:image/svg+xml;base64," x="1460" y="290" width="300" height="300"/><text x="1052" y="674" fill="#D7DEE6" font-size="25" font-weight="700">REMAINING</text><text x="1520" y="674" fill="#D7DEE6" font-size="25" font-weight="700">USED</text><text x="1366" y="466" fill="#67E9A1" font-size="64" font-weight="400">↔</text><path d="M88 846H1832" stroke="#2D353B"/><text x="88" y="900" fill="#ADB8BA" font-size="24" font-weight="500">Tap to toggle · Saved per ke